name: "CodeQL"

on:
  push:
    branches: ["master", "[0-9].[0-9]*"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["master"]
  schedule:
    - cron: "0 4 * * *"

# cancel previous workflow jobs for PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      # Lets the availability probe below tell "code scanning is not
      # enabled" apart from "this token cannot read alerts".
      security-events: read
    outputs:
      languages: ${{ steps.check.outputs.languages }}
      code-scanning: ${{ steps.code-scanning.outputs.available }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for file changes
        id: check
        uses: $/.github/actions/change-detector/
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # A repository without code scanning (e.g. a private fork or mirror
      # without GitHub Code Security) rejects the SARIF upload, so the
      # analysis would run to completion and then fail on every push.
      - name: Check code scanning availability
        id: code-scanning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/workflows/scripts/check-code-scanning-available.sh

  analyze:
    name: Analyze
    needs: changes
    # Skip on PRs that touch neither code group (e.g. docs-only) so the
    # analysis runners don't spin up. push/schedule runs always proceed:
    # the change-detector returns "all changed" for non-PR events.
    # Skipped entirely where code scanning is unavailable, since the upload
    # is this job's only product.
    if: >-
      needs.changes.outputs.code-scanning != 'false' &&
      (contains(fromJSON(needs.changes.outputs.languages), 'python') ||
       contains(fromJSON(needs.changes.outputs.languages), 'javascript'))
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.changes.outputs.languages) }}
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          # If you wish to specify custom queries, you can do so here or in a config file.
          # By default, queries listed here will override any specified in a config file.
          # Prefix the list here with "+" to use these queries and those in the config file.

          # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
          # queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{matrix.language}}"
