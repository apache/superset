name: Embedded SDK PR Checks

on:
  pull_request:
    paths:
      - "superset-embedded-sdk/**"
    types: [synchronize, opened, reopened, ready_for_review]

env:
  DEVELOCITY_PROJECT_ID: superset
  DEVELOCITY_TAG_CI: "true"
  DEVELOCITY_VALUE_CI_commit_sha: ${{ github.sha }}
  DEVELOCITY_VALUE_CI_run: ${{ github.run_id }}

permissions:
  contents: read

# cancel previous workflow jobs for PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  embedded-sdk-test:
    runs-on: ubuntu-slim
    defaults:
      run:
        working-directory: superset-embedded-sdk
    env:
      DEVELOCITY_ENABLED: ${{ secrets.DEVELOCITY_ACCESS_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "./superset-embedded-sdk/.nvmrc"
          registry-url: "https://registry.npmjs.org"
      - name: Setup Develocity for npm
        if: env.DEVELOCITY_ENABLED == 'true'
        continue-on-error: true
        uses: $/.github/actions/setup-develocity-npm
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
      - run: npm ci
      - run: npm test
      - run: npm run build
