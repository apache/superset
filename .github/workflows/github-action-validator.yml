name: Validate All GitHub Actions

on:
  push:
    branches:
      - "master"
      - "[0-9].[0-9]*"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

# cancel previous workflow jobs for PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-all-ghas:
    runs-on: ubuntu-26.04 # Don't switch to ubuntu-slim as zizmore-action requires Docker
    permissions:
      contents: read
      # Required for the zizmor action to upload its SARIF results to
      # GitHub code scanning (advanced-security is enabled by default).
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test docs-deploy freshness gate
        run: bash .github/workflows/scripts/check-docs-deploy-freshness.test.sh

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0

      - name: Install kjanat/actionlint
        run: go install actionlint.kjanat.dev/cmd/actionlint@v1.17.0

      - name: Static check for GHA workflows
        run: actionlint

      - name: Advanced security check for GHA workflows
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
