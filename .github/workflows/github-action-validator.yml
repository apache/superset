name: Validate All GitHub Actions

on:
  push:
    branches:
      - "master"
      - "[0-9].[0-9]*"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

# cancel previous workflow jobs for PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-all-ghas:
    runs-on: ubuntu-26.04 # Don't switch to ubuntu-slim as zizmore-action requires Docker
    permissions:
      contents: read
      # Required for the zizmor action to upload its SARIF results to
      # GitHub code scanning (advanced-security is enabled by default).
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "./superset-frontend/.nvmrc"

      - name: Install Dependencies
        # Versions are pinned to avoid ad-hoc, unpinned package installs.
        # Bump deliberately when upgrading.
        # zizmor: ignore[adhoc-packages] - @action-validator is a global CLI tool installed to validate the repo's workflows; a global CLI install has no application manifest/lockfile context, and the versions are pinned above
        run: npm install -g @action-validator/core@0.6.0 @action-validator/cli@0.6.0

      - name: Run Script
        run: bash .github/workflows/github-action-validator.sh

      - name: Test branch freshness gate
        run: bash .github/workflows/scripts/check-branch-freshness.test.sh

      - name: Test code scanning availability check
        run: bash .github/workflows/scripts/check-code-scanning-available.test.sh

      # A repository without code scanning (e.g. a private fork or mirror
      # without GitHub Code Security) rejects the SARIF upload. The audit
      # still runs there; its findings are reported in the job log instead.
      - name: Check code scanning availability
        id: code-scanning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/workflows/scripts/check-code-scanning-available.sh

      - name: Check for security issues on GHA workflows
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: ${{ steps.code-scanning.outputs.available != 'false' }}
