name: Update Country Maps

# Regenerates plugins/plugin-chart-country-map's GeoJSON files, countries.ts
# and docs/data/countries.json from upstream Natural Earth + community geo
# data, by running the same `build_maps.py` script `npm run update-maps` runs locally.
#
# Runs weekly and on workflow_dispatch, but only opens or updates a PR when
# the regenerated output actually differs from what's on `master` - most
# weeks this is a no-op. Unlike a translation-string catch-up, nothing here
# auto-merges: a border/region change is the kind of thing that needs an
# actual human look at the rendered maps. Community geo sources are pinned
# to a commit where practical; the live WHO ArcGIS query can't be pinned
# (it's a live service, not a repo), so a run can still legitimately pick up
# an unreviewed upstream change there. The job itself fails (separately from
# whether a PR was opened) if build_maps.py errors, so a broken
# upstream source doesn't just quietly go green.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC, an hour after sync-translation-catalogs.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: update-country-maps
  cancel-in-progress: false

jobs:
  update-country-maps:
    if: github.event_name != 'schedule' || github.repository == 'apache/superset'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: "Checkout master"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          # Exact versions, with the full resolved set pinned via a constraints
          # file, so a diff only moves with upstream data and not with a
          # GeoPandas/Shapely/pyogrio change to simplification or serialization.
          pip install -c superset-frontend/plugins/plugin-chart-country-map/scripts/requirements-constraints.txt \
            geopandas==1.1.1 shapely==2.1.1 matplotlib==3.10.3 requests==2.32.4

      - name: Run build_maps.py
        id: build
        working-directory: superset-frontend/plugins/plugin-chart-country-map/scripts
        run: |
          # Capture the exit status instead of failing here, so the drift/PR
          # steps below still run; the final step fails the job on error.
          set +e
          python3 build_maps.py --data-dir "$RUNNER_TEMP/natural-earth"
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "had_errors=true" >> "$GITHUB_OUTPUT"
            echo "::warning::build_maps.py failed (exit $status); generated data may be stale."
          else
            echo "had_errors=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for drift
        id: diff
        run: |
          PATHS="superset-frontend/plugins/plugin-chart-country-map/src/countries superset-frontend/plugins/plugin-chart-country-map/src/countries.ts docs/data/countries.json"
          if git diff --quiet -- $PATHS; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update sync PR
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/update-country-maps-automated
          HAD_ERRORS: ${{ steps.build.outputs.had_errors }}
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git checkout -b "$BRANCH"
          git add superset-frontend/plugins/plugin-chart-country-map/src/countries \
            superset-frontend/plugins/plugin-chart-country-map/src/countries.ts \
            docs/data/countries.json
          git commit -m "chore(country-map): regenerate GeoJSON from upstream sources" \
            -m "Automated run of build_maps.py (npm run update-maps). Review the rendered diffs before merging - one source (WHO ArcGIS) is a live query, not a pinned commit."
          git push --force origin "$BRANCH"

          BODY="Automated run of \`npm run update-maps\` against current \`master\`. **Please review the rendered map diffs before merging** - this pulls from several community geo sources plus a live WHO ArcGIS query that can't be pinned to a commit, so an upstream change there hasn't had human eyes on it yet."
          if [ "$HAD_ERRORS" = "true" ]; then
            BODY="$BODY

          ⚠️ build_maps.py exited with an error, so the affected countries' data may be stale rather than updated. See the workflow run log."
          fi

          if gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq 'length > 0' | grep -q true; then
            gh pr edit "$BRANCH" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --title "chore(country-map): regenerate GeoJSON from upstream sources" \
              --body "$BODY" \
              --base master --head "$BRANCH"
          fi

      - name: Close stale sync PR when no drift remains
        if: steps.diff.outputs.has_changes == 'false' && steps.build.outputs.had_errors != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/update-country-maps-automated
        run: |
          if gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq 'length > 0' | grep -q true; then
            gh pr close "$BRANCH" --repo "$GITHUB_REPOSITORY" --delete-branch \
              --comment "Upstream sources no longer differ from \`master\`, so this regenerated data is stale. Closing automatically."
          fi

      - name: Fail if build_maps.py errored
        if: steps.build.outputs.had_errors == 'true'
        run: |
          echo "::error::build_maps.py failed - see the Run build_maps.py step log. Any resulting PR update still went out; the data for the affected countries may be stale rather than updated."
          exit 1
