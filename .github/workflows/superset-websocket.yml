name: WebSocket server
on:
  push:
    branches:
      - "master"
      - "[0-9].[0-9]*"
    paths:
      - "superset-websocket/**"
  pull_request:
    paths:
      - "superset-websocket/**"
    types: [synchronize, opened, reopened, ready_for_review]

env:
  DEVELOCITY_PROJECT_ID: superset
  DEVELOCITY_TAG_CI: "true"
  DEVELOCITY_VALUE_CI_commit_sha: ${{ github.sha }}
  DEVELOCITY_VALUE_CI_run: ${{ github.run_id }}

permissions:
  contents: read

# cancel previous workflow jobs for PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  app-checks:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    env:
      DEVELOCITY_ENABLED: ${{ secrets.DEVELOCITY_ACCESS_KEY != '' }}
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: './superset-websocket/.nvmrc'
      - name: Setup Develocity for npm
        if: env.DEVELOCITY_ENABLED == 'true'
        continue-on-error: true
        uses: $/.github/actions/setup-develocity-npm
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
      - name: Install dependencies
        working-directory: ./superset-websocket
        run: npm ci
      - name: lint
        working-directory: ./superset-websocket
        run: npm run lint-check
      - name: typescript check
        working-directory: ./superset-websocket
        run: npm run type
      - name: code format check
        working-directory: ./superset-websocket
        run: npm run format-check
      - name: unit tests
        working-directory: ./superset-websocket
        run: npm run test
      - name: build
        working-directory: ./superset-websocket
        run: npm run build
