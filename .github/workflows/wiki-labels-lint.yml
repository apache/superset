name: "Wiki Labels Lint"

# Checks the wiki pages that drive labels (see wiki-labeler.yml) each time
# the wiki is edited, with the same parser the labeler uses. Wiki edits are
# not reviewed, so this is where a broken page gets noticed: the run fails,
# and GitHub notifies the person whose edit started it.

on:
  gollum:
  workflow_dispatch:
  pull_request:
    paths:
    - ".github/scripts/wiki-labels.js"
    - ".github/workflows/wiki-labels-lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: wiki-labels-lint
    permissions:
      contents: read
      issues: read # to tell which labels do not exist in the repository yet
    runs-on: ubuntu-slim
    steps:
    - name: Check out the wiki page parser
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: .github/scripts
        sparse-checkout-cone-mode: false

    # Cloned rather than fetched over raw.githubusercontent.com, which can
    # serve a copy from before the edit for a few minutes.
    - name: Check out the wiki
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.repository }}.wiki
        path: wiki
        persist-credentials: false

    - name: Lint the label pages
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const fs = require('fs');
          const wiki = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/wiki-labels.js`);
          const { owner, repo } = context.repo;

          let existing = null;
          try {
            const labels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner,
              repo,
              per_page: 100,
            });
            existing = new Set(labels.map(label => label.name));
          } catch (error) {
            core.warning(`Could not list the repository's labels (${error.message}).`);
          }

          const summary = [];
          let failures = 0;
          for (const [kind, { page }] of Object.entries(wiki.PAGES)) {
            const link = `https://github.com/${owner}/${repo}/wiki/${page}`;
            const file = `${process.env.GITHUB_WORKSPACE}/wiki/${page}.md`;
            if (!fs.existsSync(file)) {
              failures += 1;
              core.error(`${page}: the page is missing from the wiki.`);
              summary.push(`### ${page}`, '', `The page is missing: ${link}`, '');
              continue;
            }

            const { rules, problems } = wiki.parse(kind, fs.readFileSync(file, 'utf8'));
            failures += problems.length;
            for (const { line, message } of problems) {
              core.error(`${page} line ${line}: ${message}`);
            }

            const fresh = existing ? [...rules.keys()].filter(label => !existing.has(label)) : [];
            for (const label of fresh) {
              core.notice(`${page}: the label "${label}" does not exist yet. It is created, plain grey, the first time it is applied.`);
            }

            summary.push(
              `### [${page}](${link})`,
              '',
              `${rules.size} label(s) read.`,
              '',
              ...problems.map(({ line, message }) => `- Line ${line}: ${message}`),
              ...fresh.map(label => `- Note: \`${label}\` does not exist yet and is created on first use.`),
              '',
            );
          }

          await core.summary.addRaw(summary.join('\n')).write();
          if (failures) {
            core.setFailed(`${failures} problem(s) on the wiki pages that drive labels. Fix the page; the edit history shows what changed.`);
          }
