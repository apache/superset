name: "Wiki Labels Lint"

# Checks the wiki pages that drive labels (see wiki-labeler.yml) each time
# the wiki is edited, with the same parser the labeler uses. Wiki edits are
# not reviewed, so this is where a broken page gets noticed: the run fails,
# and GitHub notifies the person whose edit started it.

on:
  gollum:
  workflow_dispatch:
  pull_request:
    paths:
    - ".github/scripts/**"
    - ".github/workflows/wiki-labels-lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: wiki-labels-lint
    permissions:
      contents: read
      issues: read # to tell which labels do not exist in the repository yet
    runs-on: ubuntu-slim
    steps:
    - name: Check out the wiki label script
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: .github/scripts
        sparse-checkout-cone-mode: false

    # Cloned rather than fetched over raw.githubusercontent.com, which can
    # serve a copy from before the edit for a few minutes.
    - name: Check out the wiki
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.repository }}.wiki
        path: wiki
        persist-credentials: false

    - name: Lint the label pages
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const wiki = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/wiki-labels.js`);
          await wiki.lintPages({ github, context, core }, `${process.env.GITHUB_WORKSPACE}/wiki`);

  # Unit tests for the script, for PRs that change it.
  test:
    name: wiki-labels-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
    - name: Check out the wiki label script
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: .github/scripts
        sparse-checkout-cone-mode: false

    - name: Run the tests
      run: node --test .github/scripts/wiki-labels.test.js
