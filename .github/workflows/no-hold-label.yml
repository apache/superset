name: Hold Label Check

on:
  pull_request:
    types: [labeled, unlabeled, opened, reopened, synchronize]

permissions:
  checks: read
  pull-requests: read

# Let each label event run to completion. Cancelling in-progress runs leaves
# CANCELLED entries in the PR's check-suite rollup, which poisons GitHub's
# `status:success` search filter even though all real CI passed. The job is
# a tiny no-op github-script call, so the wasted compute is negligible.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  check-hold-label:
    runs-on: ubuntu-slim
    steps:
    - name: Check for 'hold' label
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        script: |
          const { owner, repo } = context.repo;
          const pr = context.payload.pull_request;

          // The wiki labeler (wiki-labeler.yml) starts alongside this job on
          // these events and applies its labels with GITHUB_TOKEN, which
          // never emits a `labeled` event. Wait for it to succeed, otherwise
          // this check passes before a `hold:audit-*` label lands and is
          // never re-evaluated. A labeler run that failed (say, it could
          // not read its rules) decided nothing, so that blocks too.
          if (['opened', 'reopened', 'synchronize'].includes(context.payload.action)) {
            const deadline = Date.now() + 5 * 60 * 1000;
            let run;
            while (Date.now() < deadline) {
              await new Promise(resolve => setTimeout(resolve, 10000));
              const { data: { check_runs: runs } } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: pr.head.sha,
                check_name: 'wiki-labeler',
                filter: 'latest',
              });
              run = runs[0];
              if (run?.status === 'completed') break;
            }
            if (run?.status !== 'completed') {
              core.setFailed('Timed out waiting for the wiki labeler; re-run this job.');
              return;
            }
            if (run.conclusion !== 'success') {
              core.setFailed(`The wiki labeler ended as "${run.conclusion}", so hold labels were not evaluated; re-run it, then this job.`);
              return;
            }
          }

          // Read the labels live: the event payload is a snapshot that
          // predates anything the labeler just applied.
          const { data: labels } = await github.rest.issues.listLabelsOnIssue({
            owner,
            repo,
            issue_number: pr.number,
            per_page: 100,
          });
          const held = labels.map(label => label.name).filter(name => name.includes('hold'));
          if (held.length > 0) {
            core.setFailed(`Hold label present (${held.join(', ')}), merge is blocked.`);
          }
