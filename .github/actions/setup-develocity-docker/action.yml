name: "Setup Develocity for Docker"
description: "Starts the Develocity Docker agent so that image builds publish Build Scans to develocity.apache.org"
inputs:
  develocity-access-key:
    description: "Access key for develocity.apache.org; the action exchanges it for a short-lived token"
    required: true
runs:
  using: "composite"
  steps:
    - name: Setup Develocity for Docker
      uses: gradle/develocity-actions/setup-docker@b8f7a85ff7bd4e08e804f3e5331e5c48b2e6eb17 # v2.6
      with:
        develocity-url: https://develocity.apache.org
        develocity-access-key: ${{ inputs.develocity-access-key }}
        develocity-package-scan-enabled: false
        develocity-project-id: superset
