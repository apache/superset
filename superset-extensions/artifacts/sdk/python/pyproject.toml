[project]
name = "superset-artifacts-sdk"
version = "0.1.0"
license = "Apache-2.0"
description = "Superset Artifacts SDK: the contracts the artifacts extension and its hosts share"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
testing = ["pytest"]

[build-system]
requires = ["setuptools>=76.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
