suite: init containers + extraInitContainers
templates:
  - deployment.yaml
  - deployment-worker.yaml
  - deployment-beat.yaml
  - deployment-flower.yaml
  - deployment-ws.yaml
  - deployment-mcp.yaml
  - init-job.yaml
tests:
  - it: renders only the default wait-for container by default
    template: deployment.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 1
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-postgres

  - it: appends extraInitContainers after the default initContainers
    template: deployment.yaml
    set:
      supersetNode.extraInitContainers:
        - name: prepare-assets
          image: busybox
          command: ["sh", "-c", "echo preparing"]
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-postgres
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: prepare-assets

  - it: templates values inside extraInitContainers
    template: deployment.yaml
    set:
      image.repository: example/superset
      supersetNode.extraInitContainers:
        - name: prepare-assets
          image: "{{ .Values.image.repository }}:test"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].image
          value: example/superset:test

  - it: keeps replace semantics for initContainers while appending extras
    template: deployment.yaml
    set:
      supersetNode.initContainers:
        - name: custom-wait
          image: busybox
      supersetNode.extraInitContainers:
        - name: prepare-assets
          image: busybox
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: custom-wait
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: prepare-assets

  - it: renders only extras when initContainers is cleared
    template: deployment.yaml
    set:
      supersetNode.initContainers: []
      supersetNode.extraInitContainers:
        - name: prepare-assets
          image: busybox
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 1
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: prepare-assets

  - it: appends worker extraInitContainers after wait-for-postgres-redis
    template: deployment-worker.yaml
    set:
      supersetWorker.extraInitContainers:
        - name: prepare-assets
          image: busybox
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-postgres-redis
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: prepare-assets

  - it: appends beat extraInitContainers after wait-for-postgres-redis
    template: deployment-beat.yaml
    set:
      supersetCeleryBeat.enabled: true
      supersetCeleryBeat.extraInitContainers:
        - name: prepare-assets
          image: busybox
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-postgres-redis
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: prepare-assets

  - it: appends flower extraInitContainers after wait-for-postgres-redis
    template: deployment-flower.yaml
    set:
      supersetCeleryFlower.enabled: true
      supersetCeleryFlower.extraInitContainers:
        - name: prepare-assets
          image: busybox
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-postgres-redis
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: prepare-assets

  - it: appends websockets extraInitContainers after wait-for-redis
    template: deployment-ws.yaml
    set:
      supersetWebsockets.enabled: true
      supersetWebsockets.extraInitContainers:
        - name: prepare-assets
          image: busybox
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-redis
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: prepare-assets

  - it: passes envFromSecrets into the websockets init containers
    template: deployment-ws.yaml
    set:
      supersetWebsockets.enabled: true
      envFromSecrets:
        - my-db-credentials
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].envFrom
          value:
            - secretRef:
                name: RELEASE-NAME-superset-env
            - secretRef:
                name: my-db-credentials

  - it: passes extraEnv and extraEnvRaw into the websockets init containers
    template: deployment-ws.yaml
    set:
      supersetWebsockets.enabled: true
      extraEnv:
        DB_HOST: my-postgres.example.com
      extraEnvRaw:
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: my-db-credentials
              key: password
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].env
          value:
            - name: DB_HOST
              value: my-postgres.example.com
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: my-db-credentials
                  key: password

  - it: appends mcp extraInitContainers after wait-for-postgres-redis
    template: deployment-mcp.yaml
    set:
      supersetMcp.enabled: true
      supersetMcp.extraInitContainers:
        - name: prepare-assets
          image: busybox
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-postgres-redis
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: prepare-assets

  - it: appends init job extraInitContainers after wait-for-postgres
    template: init-job.yaml
    set:
      init.extraInitContainers:
        - name: prepare-assets
          image: busybox
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-postgres
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: prepare-assets

  - it: only references the chart secret when no extra env sources are set
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].envFrom
          value:
            - secretRef:
                name: RELEASE-NAME-superset-env
      - notExists:
          path: spec.template.spec.initContainers[0].env

  - it: passes envFromSecrets into the init containers
    template: deployment.yaml
    set:
      envFromSecrets:
        - my-db-credentials
        - "{{ .Release.Name }}-extra-credentials"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].envFrom
          value:
            - secretRef:
                name: RELEASE-NAME-superset-env
            - secretRef:
                name: my-db-credentials
            - secretRef:
                name: RELEASE-NAME-extra-credentials

  - it: passes extraEnv and extraEnvRaw into the init containers
    template: deployment.yaml
    set:
      extraEnv:
        DB_HOST: my-postgres.example.com
      extraEnvRaw:
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: my-db-credentials
              key: password
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].env
          value:
            - name: DB_HOST
              value: my-postgres.example.com
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: my-db-credentials
                  key: password

  - it: keeps env sources declared on a custom init container
    template: deployment.yaml
    set:
      envFromSecrets:
        - my-db-credentials
      extraEnv:
        DB_HOST: my-postgres.example.com
      supersetNode.initContainers:
        - name: custom-wait
          image: busybox
          env:
            - name: CUSTOM
              value: "1"
          envFrom:
            - configMapRef:
                name: custom-config
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].env
          value:
            - name: CUSTOM
              value: "1"
            - name: DB_HOST
              value: my-postgres.example.com
      - equal:
          path: spec.template.spec.initContainers[0].envFrom
          value:
            - configMapRef:
                name: custom-config
            - secretRef:
                name: my-db-credentials

  - it: passes envFromSecrets into the init job init containers
    template: init-job.yaml
    set:
      envFromSecrets:
        - my-db-credentials
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].envFrom
          value:
            - secretRef:
                name: RELEASE-NAME-superset-env
            - secretRef:
                name: my-db-credentials
