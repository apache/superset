suite: metadata database credentials from an existing Secret
templates:
  - deployment.yaml
  - deployment-worker.yaml
  - deployment-beat.yaml
  - deployment-flower.yaml
  - deployment-ws.yaml
  - deployment-mcp.yaml
  - init-job.yaml
  - secret-env.yaml
  - secret-superset-config.yaml
set:
  supersetCeleryBeat.enabled: true
  supersetCeleryFlower.enabled: true
  supersetWebsockets.enabled: true
  supersetMcp.enabled: true
tests:
  - it: references the default password key in every workload
    templates: &workloads
      - deployment.yaml
      - deployment-worker.yaml
      - deployment-beat.yaml
      - deployment-flower.yaml
      - deployment-ws.yaml
      - deployment-mcp.yaml
      - init-job.yaml
    set:
      database.existingSecret: metadata-credentials
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASS
            valueFrom:
              secretKeyRef:
                name: metadata-credentials
                key: password
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == 'DB_USER')]

  - it: uses custom credential keys and a templated Secret name in every workload
    templates: *workloads
    release:
      name: analytics
    set:
      database.existingSecret: '{{ .Release.Name }}-database'
      database.secretKeys.password: db-password
      database.secretKeys.user: db-user
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASS
            valueFrom:
              secretKeyRef:
                name: analytics-database
                key: db-password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USER
            valueFrom:
              secretKeyRef:
                name: analytics-database
                key: db-user

  - it: omits the unused literal password but keeps the configured username
    template: secret-env.yaml
    set:
      database.existingSecret: metadata-credentials
      database.user: metadata-user
      database.password: unused-literal-password
    asserts:
      - notExists:
          path: stringData.DB_PASS
      - equal:
          path: stringData.DB_USER
          value: metadata-user

  - it: keeps the legacy username when only the password comes from a Secret
    template: secret-env.yaml
    set:
      database.existingSecret: metadata-credentials
      supersetNode.connections.db_user: legacy-user
      supersetNode.connections.db_pass: unused-legacy-password
    asserts:
      - notExists:
          path: stringData.DB_PASS
      - equal:
          path: stringData.DB_USER
          value: legacy-user

  - it: omits both mapped credentials while preserving the database connection settings
    template: secret-env.yaml
    set:
      database.existingSecret: metadata-credentials
      database.secretKeys.user: username
      database.user: unused-literal-user
      database.password: unused-literal-password
      database.host: postgres.example
      database.port: 5433
      database.name: metadata
    asserts:
      - notExists:
          path: stringData.DB_PASS
      - notExists:
          path: stringData.DB_USER
      - equal:
          path: stringData.DB_HOST
          value: postgres.example
      - equal:
          path: stringData.DB_PORT
          value: '5433'
      - equal:
          path: stringData.DB_NAME
          value: metadata

  - it: preserves literal credentials when no existing Secret is selected
    template: secret-env.yaml
    set:
      database.secretKeys.user: username
      database.user: metadata-user
      database.password: literal-password
    asserts:
      - equal:
          path: stringData.DB_USER
          value: metadata-user
      - equal:
          path: stringData.DB_PASS
          value: literal-password

  - it: adds no credential references when no existing Secret is selected
    templates: *workloads
    set:
      database.secretKeys.user: username
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == 'DB_PASS')]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == 'DB_USER')]

  - it: references credentials independently of the generated environment Secret
    templates: *workloads
    set:
      database.existingSecret: metadata-credentials
      secretEnv.create: false
      envFromSecret: external-environment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASS
            valueFrom:
              secretKeyRef:
                name: metadata-credentials
                key: password
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: external-environment
      - hasDocuments:
          count: 0
        template: secret-env.yaml

  - it: ignores the existing Secret when a full database URI is supplied
    templates: *workloads
    set:
      database.uri: postgresql://uri-user:uri-password@postgres/metadata
      database.existingSecret: absent-secret
      database.secretKeys.user: username
      database.secretKeys.password: ''
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == 'DB_PASS')]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == 'DB_USER')]
      - equal:
          path: stringData.DB_USER
          value: superset
        template: secret-env.yaml
      - equal:
          path: stringData.DB_PASS
          value: superset
        template: secret-env.yaml
      - matchRegex:
          path: 'stringData["superset_config.py"]'
          pattern: 'SQLALCHEMY_DATABASE_URI = "postgresql://uri-user:uri-password@postgres/metadata"'
        template: secret-superset-config.yaml

  - it: rejects an empty password key when the existing Secret is used
    template: init-job.yaml
    set:
      database.existingSecret: metadata-credentials
      database.secretKeys.password: ''
    asserts:
      - failedTemplate:
          errorMessage: database.secretKeys.password must be set when database.existingSecret is used

  - it: rejects a Secret name that renders to an empty string
    template: secret-env.yaml
    set:
      database.existingSecret: '{{ "" }}'
    asserts:
      - failedTemplate:
          errorMessage: database.existingSecret must render to a non-empty Secret name

  - it: reports a missing password key when the key mapping is unset
    template: init-job.yaml
    set:
      database.existingSecret: metadata-credentials
      database.secretKeys: null
    asserts:
      - failedTemplate:
          errorMessage: database.secretKeys.password must be set when database.existingSecret is used

  - it: keeps explicit environment overrides after the credential reference
    template: init-job.yaml
    set:
      database.existingSecret: metadata-credentials
      extraEnv:
        DB_PASS: explicit-override
      extraEnvRaw:
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: final-override
              key: alternate-password
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: metadata-credentials
                  key: password
            - name: DB_PASS
              value: explicit-override
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: final-override
                  key: alternate-password

  - it: leaves TCP wait containers independent of database credentials
    templates: *workloads
    set:
      database.existingSecret: metadata-credentials
      database.secretKeys.user: username
    asserts:
      - notExists:
          path: spec.template.spec.initContainers[0].env

  - it: preserves custom and extra init containers without injecting credentials
    template: deployment.yaml
    set:
      database.existingSecret: metadata-credentials
      supersetNode.initContainers:
        - name: custom-wait
          image: busybox
          env:
            - name: CUSTOM_ENV
              value: custom-value
      supersetNode.extraInitContainers:
        - name: prepare-assets
          image: busybox
    asserts:
      - equal:
          path: spec.template.spec.initContainers
          value:
            - name: custom-wait
              image: busybox
              env:
                - name: CUSTOM_ENV
                  value: custom-value
            - name: prepare-assets
              image: busybox
