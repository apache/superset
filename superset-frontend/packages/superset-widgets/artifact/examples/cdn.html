<!--
Claude artifact that loads the published widgets bundle from a CDN. Replace
{{SUPERSET_WIDGETS_URL}} with the bundle URL (an allowlisted CDN), or run
SUPERSET_WIDGETS_URL=https://... node artifact/build.mjs.

Publish it with this capabilities manifest:
  {"mcp": {"servers": [{"server": "Superset", "tools": ["query_dataset"]}]}}
For strategy "widget-tools" (saved widgets, every inline widget) list:
  ["get_widget_data", "get_widget_values", "get_saved_widget"]
MCP-backed artifacts cannot be shared publicly.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Births by state</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #f5f4f0;
        color: #1d1d1b;
      }
      .page {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        max-width: 960px;
        margin: 0 auto;
        padding: 16px;
      }
      .toolbar,
      .status {
        grid-column: 1 / -1;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .card {
        box-sizing: border-box;
        height: 340px;
        padding: 12px;
        border: 1px solid #e4e2dc;
        border-radius: 8px;
        background: #fff;
      }
      .card.small {
        height: 110px;
      }
      .card.wide {
        grid-column: 1 / -1;
      }
      .status {
        min-height: 1.5em;
        font-size: 13px;
        opacity: 0.75;
      }
      @media (max-width: 640px) {
        .page {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="toolbar" role="group" aria-label="Host filter on state">
        <button type="button" data-state="CA">CA</button>
        <button type="button" data-state="NY">NY</button>
        <button type="button" data-state="TX">TX</button>
        <button type="button" data-state="">All states</button>
      </div>
      <div id="gender" class="card small"></div>
      <div id="total" class="card small"></div>
      <div id="by-state" class="card wide"></div>
      <output id="status" class="status"></output>
    </div>
    <script src="{{SUPERSET_WIDGETS_URL}}"></script>
    <script>
      (function () {
        var W = window.SupersetWidgets;
        var status = document.getElementById('status');
        if (!W) {
          status.textContent =
            'The Superset widgets bundle did not load from {{SUPERSET_WIDGETS_URL}}.';
          return;
        }

        var DATASET_ID = 17;
        var session = W.createSession({
          // The Superset connector's display name in Claude settings.
          server: 'Superset',
          // Works against deployments that only have query_dataset.
          strategy: 'query-dataset',
        });

        session.mount(
          document.getElementById('gender'),
          { type: 'filter.select', props: { datasetId: DATASET_ID, column: 'gender' } },
          { instanceId: 'gender' },
        );
        session.mount(
          document.getElementById('total'),
          {
            type: 'metric-tile',
            props: {
              dataBinding: { datasetId: DATASET_ID, metrics: ['sum__num'] },
              label: 'Total births',
            },
          },
          { instanceId: 'total' },
        );
        session.mount(
          document.getElementById('by-state'),
          {
            type: 'echarts',
            props: {
              chartType: 'bar',
              crossFilter: true,
              dataBinding: {
                datasetId: DATASET_ID,
                metrics: ['sum__num'],
                dimensions: ['state'],
                rowLimit: 10,
              },
              echartsOptions: {
                xAxis: {
                  type: 'category',
                  data: { $bind: { source: 'dimension', alias: 'state' } },
                },
                yAxis: { type: 'value' },
              },
              chrome: { titleText: 'Births by state (top 10)' },
            },
          },
          { instanceId: 'by-state' },
        );

        session.on('valueChanged', function (event) {
          var resolved = event.payload && event.payload.resolved;
          status.textContent =
            event.nodeId +
            ': ' +
            (resolved
              ? resolved.column + ' ' + resolved.operator + ' ' + JSON.stringify(resolved.value)
              : 'cleared');
        });

        document.querySelectorAll('[data-state]').forEach(function (button) {
          button.addEventListener('click', function () {
            var value = button.getAttribute('data-state');
            session.setFilter(
              'state',
              value
                ? { datasetId: DATASET_ID, column: 'state', operator: 'IN', value: [value] }
                : null,
            );
          });
        });
      })();
    </script>
  </body>
</html>
